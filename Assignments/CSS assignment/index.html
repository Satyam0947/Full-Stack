<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS assignment 1</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="hello" id="login">
        <h2>Login</h2>
        <div>
            <label for="email"></label>
            <input type="email"
            name="email"
            id="email"
            placeholder="Enter your email">
        </div>
        <br>
        <div>
            <label for="password"></label>
            <input type="password"
            name="password"
            id="password"
            placeholder="Confirm a password">
        </div>
        <br>

        <div id="checkbox">
            <label for="remember">
            <input type="checkbox"
            name="remember"
            id="remember">
            <span>Remember me</span>

            <a href="#">Forget password?</a>
            </label>
        </div>
        <br>            
        <button id="button1">Login now</button>
        <br>
        <p class="bottomtext">
            Don't have an account?
            <a href="#">Signup now</a>
        </p>
        
        
    </div>

    <div class="hello" id="registration">
        <h2>Registration</h2>
    </div>
</body>
</html>
