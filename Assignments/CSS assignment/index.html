<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS assignment 1</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">

        <div class="helloo" >
        <h2>Login</h2>
        <div class="inputbox">
            <label for="email"></label>
            <input type="email"
            name="email"
            id="email"
            placeholder="Enter your email">
        </div>
        <br>
        <div class="inputbox">
            <label for="password"></label>
            <input type="password"
            name="password"
            id="password"
            placeholder="Confirm a password">
        </div>
        <br>

        <div class="checkbox">
            <label for="remember">
            <input type="checkbox"
            name="remember"
            id="remember">
            <span>Remember me</span>
            </label>
            
            <a href="#">Forget password?</a>
            
        </div>
        <br>            
        <button id="button1">Login now</button>
        <br>
        <p class="bottomtext">
            Don't have an account?
            <a href="#">Signup now</a>
        </p>
        </div>

        <div class="hello" >
        <h2>Registration</h2>

        <div class="inputbox">
            <label for="name"></label>
            <input type="name"
            name="name"
            id="name"
            placeholder="Enter your name">
        </div>
        <br>
        <div class="inputbox">
            <label for="email"></label>
            <input type="email"
            name="name"
            id="email"
            placeholder="Enter your email">
        </div>
        <br>
        <div class="inputbox">
            <label for="password"></label>
            <input type="password"
            name="password"
            id="password"
            placeholder="Create your password">
        </div>
        <br>
        <div class="inputbox">
            <label for="password"></label>
            <input type="password"
            name="password"
            id="password"
            placeholder="Confirm your password">
        </div>
        <br>
        <div class="check">
            <label for="terms"></label>
            <input type="checkbox"
            id="terms">
            <span>I accept all terms & conditions</span>
        </div>
        <br>
        <button id="button1">Register now</button>
        <br>
        <p class="bottomtext">
            Already have an account?
            <a href="#">Login now</a>    
        </p>


        </div>

    </div>
    


    
</body>
</html>
