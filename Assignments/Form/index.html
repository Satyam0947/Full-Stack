<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Assignment</title>
</head>
<body>
    <fieldset>
       <form>
        <h2>Admin Login Page</h2>
        <br>
        <label for="username">Username :</label>
        <input 
        type="username"
        name="username"
        id="username"
        >
        <br>
        <br>
        <label for="password">Password :</label>
        <input 
        type="password"
        name="password"
        id="password"
        >
        <br>
        <br>
        <button>Submit</button>
        <button>Reset</button>
       </form> 
    </fieldset>
    <br>
    <br>
    
    <fieldset>
        <form>
            <h2>Pizza Order Form</h2>
            <label for="firstname">First Name :</label>
            <input 
            type="firstname"
            name="firstname"
            id="firstname"
            >
            <br>
            <br>
            <label for="lastname">Last Name :</label>
            <input 
            type="lastname"
            name="lastname"
            id="lastname"
            >
            <br>
            <br>
            <label for="contact number">Contact Number :</label>
            <input 
            type="number"
            name="contact"
            id="contact number"
            >
            <br>
            <br>
            <label for="date">Preferred Delivery Date :</label>
            <input 
            type="date"
            name="date"
            id="date"
            >
            <br>
            <br>
            <label for="size">Size :</label>
            <br>
            <br>
            <label for="small"></label>
            <input 
            type="radio"
            name="small"
            id="small">
            <span>Small</span>
            <label for="medium"></label>
            <input type="radio"
            name="medium"
            id="medium">
            <span>Medium</span>
            <label for="large"></label>
            <input type="radio"
            name="large"
            id="large">
            <span>Large</span>
            <br><br>
            <label for="flavor">Flavor :</label>
            






        </form>
    </fieldset>


   
</body>
</html>
