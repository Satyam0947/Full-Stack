<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navigation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        .nav-item{
            cursor: pointer;
        }
        
        #dropdown{
            background-color: transparent;
            border: none;
        }

        #dropdown:hover{
            background-color: transparent;
            border: none;
        }
    </style>

</head>
<body>

    <div class="navbar bg-primary">
        <div class="container">
            <div class="navbar-brand text-light fw-bolder">Learning HUB</div>
                <div class="nav-item text-light d-flex gap-5 align-items-center" >
                <div class="nav-link">Home</div>
                <div class="dropdown">
                    <button
                    class="btn btn-primary dropdown-toggle"
                    id="drpdown"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    >
                    Course
                    </button>

                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">HTML</a></li>
                        <li><a class="dropdown-item" href="#">CSS</a></li>
                        <li><a class="dropdown-item" href="#">JAVASCRIPT</a></li>
                    </ul>
                </div>
                <div class="nav-link">About</div>
                <div class="nav-link">Section</div>
                </div>
        </div>
    </div>
    

    <div class="container p-3">
        <h2>Course Search and Subcription</h2>
        <div class="input-group">
            <input type="text" name="search" id="search" class="form-control" placeholder="Search for a Course">
            <button class="btn btn-primary">Search</button>
        </div>
        <br>
        <div class="input-group">
            <input type="email" name="search" id="search" class="form-control" placeholder="Enter your email">
            <button class="btn btn-success">Subscribe</button>
        </div>
        <br>
        <div class="input-group">
            <input type="name" name="search" id="search" class="form-control" placeholder="Username">
        </div>
        <br>
        Email
        <div class="input-group">
            <input type="email" name="search" id="search" class="form-control is-invalid" placeholder="invalid email">
        </div>
        <p class="text-danger">Please enter a valid email</p>
        Email
        <div class="input-group">
            <input type="email" name="search" id="search" class="form-control is-valid" placeholder="student@example.com">
        </div>
        <p class="text-success">Email address is valid</p>
    

        <div>
            <!-- Button trigger modal -->
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
        Change Password
        </button>

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Change Password</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body ">
        <h6>New password</h6>
        <input type="password" class="form-control">
        <br>
        <h6>Confirm password</h6>
        <input type="password" class="form-control">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Save changes</button>
      </div>
    </div>
  </div>
</div>
        </div>

    </div>

    <script
     src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
</body>
</html>
