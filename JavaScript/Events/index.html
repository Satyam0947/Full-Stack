<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
     <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
</head>
<body>
    <h2>Welcome</h2>
    <button onclick="ShowAlert()">click me</button>
    <button id="clickButton">click me 2</button>
    <br><br>
    <div id="box">This is box</div> 
    <br>

    <p
      onmouseover="this.textContent = 'Pointer is over the paragraph!'"
      onmouseout="this.textContent = 'Move your pointer here.'"
    >Move your pointer here.</p>
    <br>

    <div class="p-4" id="box2" style="border: 1px solid #000;"
    onmouseover="textContent = 'The mouse entered in box'"
    onmouseout="textContent = 'The mouse exit from box'">
        Interact with this box 
    </div>

     <input type="text" name="fullName" id="fullName" />
    <button id="nameSubmit">Submit</button>

    <hr />
    <br />

    <form id="LoginForm">
      <input type="text" name="userName" id="userName" placeholder="UserName" />
      <br /><br />
      <input
        type="password"
        name="password"
        id="password"
        placeholder="****************"
      />
      <br /><br />
      <button>Login</button>
    </form>


    


    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>

</body>
</html>
